<!DOCTYPE html>
<html lang="fr">
<head>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: #FAF7F2;
            color: #2C2C3A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .wrap { max-width: 520px; }
        .code {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 700;
            line-height: 1;
            color: #1A1A2E;
            margin-bottom: 0.5rem;
        }
        .code span { color: #C6993E; }
        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1A1A2E;
        }
        p {
            font-size: 1rem;
            color: #8A8A9A;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.95rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            background: linear-gradient(135deg, #C6993E, #DBAF56);
            color: #fff;
            transition: box-shadow 0.3s, transform 0.3s;
        }
        a:hover {
            box-shadow: 0 8px 30px rgba(198,153,62,0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">4<span>0</span>4</div>
